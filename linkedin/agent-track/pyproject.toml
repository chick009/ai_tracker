[project]
name = "agent-track"
version = "0.1.0"
description = "Multi-service agent tracker. First service: LinkedIn Feed Digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-track = "agent_track.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
