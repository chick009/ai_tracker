[project]
name = "paper-review"
version = "0.1.0"
description = "HF Daily Papers → figure-backed methodology review HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pillow>=10.4",
  "pypdf>=5.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
svg = ["cairosvg>=2.7"]

[project.scripts]
paper-review = "paper_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paper_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: hits live arXiv (used by the sample end-to-end run)",
]
